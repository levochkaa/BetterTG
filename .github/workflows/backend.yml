name: Backend

on:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgresql://bettertg:bettertg@127.0.0.1:5433/bettertg
      REDIS_URL: redis://127.0.0.1:6380/0
      BETTERTG_TEST_DATABASE_URL: postgresql://bettertg:bettertg@127.0.0.1:5433/bettertg
      BETTERTG_TEST_REDIS_URL: redis://127.0.0.1:6380/0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres redis
      - run: cargo build --locked --bins
      - run: target/debug/bettertg-backend migrate run
      - run: target/debug/bettertg-backend migrate revert
      - run: target/debug/bettertg-backend migrate run
      - run: cargo test --locked
      - name: Encrypted relay smoke
        run: |
          PORT=3000 PUBLIC_BASE_URL=http://127.0.0.1:3000 target/debug/bettertg-backend api >/tmp/bettertg-api.log 2>&1 &
          API_PID=$!
          target/debug/bettertg-backend worker >/tmp/bettertg-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$API_PID" "$WORKER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/health/ready && break
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:3000 SMOKE_REDIS_URL=redis://127.0.0.1:6380/0 target/debug/smoke-relay
      - run: docker build --tag bettertg-backend:ci .
      - if: always()
        run: docker compose down --volumes
