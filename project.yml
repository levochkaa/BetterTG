name: BetterTG
options:
  bundleIdPrefix: com.levochkaaa
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: 27.0
  projectFormat: xcode16_3
  indentWidth: 4
  tabWidth: 4
  deploymentTarget:
    iOS: 26.0
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 4
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 7Z2WHPKU8W
    SDKROOT: iphoneos
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_OBJC_INTEROP_MODE: objcxx
    SWIFT_VERSION: "5.0"
    WATCHOS_DEPLOYMENT_TARGET: 9.0
packages:
  FFmpegBridge:
    path: Packages/FFmpegBridge
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    exactVersion: 4.6.1
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: 1.6.0
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
  TDLibKit:
    url: https://github.com/levochkaa/TDLibKit.git
    exactVersion: 2.0.0-tdlib-1.8.68-c15d3f5a
targets:
  BetterTG:
    type: application
    platform: iOS
    sources:
      - path: BetterTG
        excludes:
          - Info.plist
          - Secret/Secret.swift.gyb
          - "**/.DS_Store"
    dependencies:
      - package: FFmpegBridge
      - package: Lottie
      - package: libwebp
      - package: SwiftMath
      - package: TDLibKit
        product: TDLibKitShared
        embed: true
      - target: BetterTGNotificationService
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: BetterTG/BetterTG.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BetterTG/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BetterTG
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSCameraUsageDescription: We use the camera when you take photos or record video messages in chats.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: We use your location only when you choose to share it with a bot.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: We use the microphone when you record voice or video messages in chats.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: We would like to access Photos to save images you request.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: We would like to access your Photos to let you send them in chats.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        SWIFT_OBJC_BRIDGING_HEADER: BetterTG/BetterTG-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - $(inherited)
          - -lz
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaaa.BetterTG
        PRODUCT_NAME: $(TARGET_NAME)
        PROVISIONING_PROFILE_SPECIFIER: ""
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_USE_INTEGRATED_DRIVER: NO
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
          APS_ENVIRONMENT: development
          BETTERTG_RELAY_BASE_URL: http://127.0.0.1:8080
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          APP_ATTEST_ENVIRONMENT: production
          APS_ENVIRONMENT: production
          BETTERTG_RELAY_BASE_URL: ""
    postCompileScripts:
      - name: SwiftFormat
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          if [ -x /opt/homebrew/bin/swiftformat ]; then
            /opt/homebrew/bin/swiftformat "$SRCROOT" --config "$SRCROOT/.swiftformat" --lint --lenient
          else
            echo "warning: SwiftFormat not installed. Install from https://github.com/nicklockwood/SwiftFormat (Homebrew: brew install swiftformat)"
          fi
    scheme:
      gatherCoverageData: false
  BetterTGNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: BetterTGNotificationService
        excludes:
          - Info.plist
          - BetterTGNotificationService.entitlements
      - path: BetterTG/Shared
      - path: BetterTG/Models/TelegramAccount.swift
      - path: BetterTG/Secret/Secret.swift
    dependencies:
      - package: TDLibKit
        product: TDLibKitShared
        embed: false
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        # This notification service uses legacy Intents, not AppIntent declarations.
        LM_SKIP_METADATA_EXTRACTION: YES
        CODE_SIGN_ENTITLEMENTS: BetterTGNotificationService/BetterTGNotificationService.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BetterTGNotificationService/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: 26.0
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaaa.BetterTG.NotificationService
        PRODUCT_NAME: $(TARGET_NAME)
        PROVISIONING_PROFILE_SPECIFIER: ""
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_USE_INTEGRATED_DRIVER: NO
        TARGETED_DEVICE_FAMILY: 1
